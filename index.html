<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Roblox Cover AI</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

.box{
border:2px dashed #777;
padding:20px;
margin:20px;
border-radius:15px;
}

button{
background:#7357ff;
color:white;
border:0;
padding:12px 20px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

canvas{
margin-top:20px;
background:white;
max-width:90%;
}
</style>
</head>

<body>

<h1>🤖 Roblox Cover AI</h1>


<div class="box">

<h3>🧍 Скин персонажа</h3>

<input type="file" id="skin" accept="image/*">

</div>



<div class="box">

<h3>🎒 Предметы вокруг</h3>

<input type="file" id="items" accept="image/*" multiple>

</div>


<button onclick="makeCover()">
Собрать обложку
</button>


<br>

<canvas id="canvas" width="1200" height="1200"></canvas>

<br>

<button onclick="download()">
Скачать PNG
</button>



<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");


let skinImg;
let items=[];



document.getElementById("skin").onchange=e=>{

let img=new Image();

img.onload=()=>skinImg=img;

img.src=URL.createObjectURL(e.target.files[0]);

}



document.getElementById("items").onchange=e=>{

items=[];

for(let file of e.target.files){

let img=new Image();

img.onload=()=>{

items.push(img);

}

img.src=URL.createObjectURL(file);

}

}




function makeCover(){

ctx.clearRect(0,0,1200,1200);


ctx.fillStyle="#ffffff";

ctx.fillRect(0,0,1200,1200);



// предметы

let positions=[

[80,80],
[500,80],
[900,80],

[80,500],
[900,500],

[100,900],
[500,900],
[900,900]

];


items.forEach((img,i)=>{

let p=positions[i%positions.length];

ctx.drawImage(
img,
p[0],
p[1],
220,
220
);

});



// персонаж

if(skinImg){

ctx.drawImage(
skinImg,
430,
250,
340,
600
);

}


}



function download(){

let a=document.createElement("a");

a.download="roblox-cover.png";

a.href=canvas.toDataURL();

a.click();

}


</script>


</body>
</html>
