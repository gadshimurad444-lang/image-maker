<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Roblox Cover AI</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.box{
border:2px dashed #777;
border-radius:15px;
padding:20px;
margin:20px;
}

button{
background:#7357ff;
color:white;
border:0;
padding:12px 25px;
border-radius:10px;
font-size:16px;
}

canvas{
margin-top:20px;
max-width:95%;
}
</style>
</head>

<body>

<h1>🤖 Roblox Cover AI</h1>

<div class="box">
<h3>🧍 Скин</h3>
<input id="skin" type="file" accept="image/*">
</div>


<div class="box">
<h3>🎒 Лист предметов</h3>
<input id="items" type="file" accept="image/*">
</div>


<button onclick="create()">Создать обложку</button>

<br>

<canvas id="c" width="1200" height="1200"></canvas>

<br>

<button onclick="save()">Скачать PNG</button>


<script>

let canvas=document.getElementById("c");
let ctx=canvas.getContext("2d");

let skin=null;
let itemSheet=null;


document.getElementById("skin").onchange=e=>{
let img=new Image();
img.onload=()=>skin=img;
img.src=URL.createObjectURL(e.target.files[0]);
}


document.getElementById("items").onchange=e=>{
let img=new Image();
img.onload=()=>itemSheet=img;
img.src=URL.createObjectURL(e.target.files[0]);
}



function cutItems(){

let arr=[];

if(!itemSheet)return arr;


// сетка как Roblox каталог

let cols=8;
let rows=8;


let w=itemSheet.width/cols;
let h=itemSheet.height/rows;


for(let y=0;y<rows;y++){

for(let x=0;x<cols;x++){

let temp=document.createElement("canvas");
temp.width=w;
temp.height=h;

let t=temp.getContext("2d");

t.drawImage(
itemSheet,
x*w,
y*h,
w,
h,
0,
0,
w,
h
);


let img=new Image();

img.src=temp.toDataURL();

arr.push(img);

}

}

return arr;

}




function create(){

ctx.clearRect(0,0,1200,1200);


// фон

let grad=ctx.createLinearGradient(0,0,1200,1200);
grad.addColorStop(0,"#222");
grad.addColorStop(1,"#555");

ctx.fillStyle=grad;
ctx.fillRect(0,0,1200,1200);



let items=cutItems();


// предметы вокруг

let pos=[

[50,50],
[430,40],
[820,50],

[50,430],
[850,430],

[70,850],
[430,900],
[820,850]

];


items.slice(0,8).forEach((img,i)=>{

setTimeout(()=>{

ctx.drawImage(
img,
pos[i][0],
pos[i][1],
250,
250
);

},100);

});



// персонаж

if(skin){

ctx.drawImage(
skin,
400,
260,
400,
650
);

}


}



function save(){

let a=document.createElement("a");

a.download="roblox-cover.png";

a.href=canvas.toDataURL();

a.click();

}


</script>

</body>
</html>
